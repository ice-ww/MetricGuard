name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUTF8: '1'
      METRICGUARD_BROWSER_CHANNEL: chromium
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Install browser
        run: uv run playwright install --with-deps chromium
      - name: Verify PowerShell for recovery-command tests
        shell: pwsh
        run: $PSVersionTable.PSVersion.ToString()
      - name: Build isolated query worker
        run: |
          docker build --iidfile /tmp/metricguard-image-id experiments/t02
          echo "METRICGUARD_TEST_IMAGE=$(cat /tmp/metricguard-image-id)" >> "$GITHUB_ENV"
      - name: Evidence, types and full controlled test suite
        run: uv run python -m tools.check
      - name: Preserve test reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: check-results
          path: artifacts/checks/
          if-no-files-found: ignore
