[project]
name = "metricguard-validation"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "duckdb>=1.4,<2",
    "pytz>=2025.2",
    "sqlglot>=27,<31",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "mypy>=1.15,<2",
    "statsmodels==0.14.6",
    "langgraph==1.2.14",
    "langgraph-checkpoint-sqlite==3.1.1",
    "anthropic==1.13.0",
    "types-pytz>=2026.5.0.20261006",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
files = ["experiments/t01", "experiments/t02", "experiments/t03", "experiments/t04", "experiments/t05", "experiments/t06", "experiments/t07", "experiments/t08", "experiments/t09", "experiments/t10", "experiments/t11", "experiments/t12", "experiments/t13", "experiments/t14", "experiments/t15", "metricguard"]
