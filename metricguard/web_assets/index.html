<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>MetricGuard · 本机分析</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body><header><a href="/" class="brand">MetricGuard</a><span>本机分析工作台</span><span class="local">仅本机</span></header>
<main><section class="compose" aria-labelledby="compose-title"><h1 id="compose-title">提出一个问题</h1><p class="intro">选择数据，明确你想了解的指标。结果会保留在本机。</p>
<form id="analysis-form"><fieldset id="fields" disabled><label for="snapshot">数据快照</label><select id="snapshot" required></select><button id="example" type="button" class="text-button" hidden>填入开发示例</button>
<label for="question">分析问题</label><textarea id="question" required maxlength="2000" rows="4" placeholder="例如：这个日期窗口内的新增用户数是多少？"></textarea>
<fieldset class="dates"><legend>分析日期 <span>可选</span></legend><div><label for="start">开始日期（包含）</label><input id="start" type="date"></div><div><label for="end">结束日期（不包含）</label><input id="end" type="date"></div></fieldset>
<details><summary>指定比较基期（可选）</summary><div class="dates"><div><label for="previous-start">基期开始（包含）</label><input id="previous-start" type="date"></div><div><label for="previous-end">基期结束（不包含）</label><input id="previous-end" type="date"></div></div></details>
<p class="hint">日期不明确或信息冲突时，任务会等待澄清。本版保留等待记录，回答功能将在下一阶段提供。</p></fieldset>
<button type="submit" id="submit" disabled>开始分析</button><button type="button" id="new" class="secondary" hidden>新建问题</button><p id="error" role="alert"></p></form></section>
<section class="workspace" aria-labelledby="result-title"><div class="result-header"><h2 id="result-title">任务与结果</h2><span id="status" role="status">尚未开始</span></div>
<p id="empty">提交问题后，这里会显示运行状态和分析结果。关闭页面不会取消任务。</p>
<div id="task" hidden><div class="task-meta"><a id="task-link">当前任务</a><span id="elapsed"></span></div><p id="task-question"></p><p id="scope"></p><p id="pending"></p><p id="connection" role="status"></p><pre id="result"></pre><p class="hint">当前版本提供基础结果展示。证据展开与定位将在报告阶段交付；这里的候选解释不代表已证明因果。</p></div>
</section></main><footer>快照文件与任务记录保存在本机；分析按现有配置调用模型服务。每次只执行一个任务。</footer></body></html>
